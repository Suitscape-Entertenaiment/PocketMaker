<!DOCTYPE html>
<html lang="es" class="h-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pocket Maker 4.26</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
  <script src="https://unpkg.com/blockly/blockly_compressed.js"></script>
  <script src="https://unpkg.com/blockly/blocks_compressed.js"></script>
  <script src="https://unpkg.com/blockly/javascript_compressed.js"></script>
  <script src="https://unpkg.com/blockly/msg/en.js"></script>
  <script src="https://unpkg.com/@blockly/field-colour@6.0.3/dist/index.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/sweetalert2/11.26.25/sweetalert2.all.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"></script>
  <script src="https://unpkg.com/tone@14.7.77/build/Tone.js"></script>
</head>
<body class="vh-100 overflow-hidden d-flex flex-column">

  <nav class="navbar bg-body-tertiary px-3 border-bottom flex-shrink-0" style="height: 50px;">
    <div class="container-fluid p-0">
      <a class="navbar-brand me-auto" href="index-01.html">
        <img src="./icon.png" alt="icon" id="logo" height="31" style="cursor: pointer;">
      </a>
      <div class="d-flex gap-2">
        <button type="button" onclick="run_code()" class="btn btn-sm btn-success">
          <i class="fa-solid fa-play"></i>
        </button>
        <button type="button" onclick="stop_code()" class="btn btn-sm btn-danger">
          <i class="fa-solid fa-stop"></i>
        </button>
        <button type="button" onclick="see_code()" class="btn btn-sm btn-primary">
          <i class="fa-solid fa-code"></i>
        </button>
        <button type="button" class="btn btn-sm btn-secondary" data-bs-toggle="offcanvas" data-bs-target="#offcanvasExample" aria-controls="offcanvasExample">
          <i class="fa-solid fa-sliders"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="container-fluid p-2 flex-grow-1 overflow-hidden">
    <div class="row g-2 h-100">
      <div class="col-12 col-md-auto d-flex justify-content-center align-items-start">
        <canvas id="canvas" class="canvas border rounded shadow-sm" style="width: 330px; height: 230px;"></canvas>
      </div>
      <div class="col-12 col-md d-flex flex-column h-100">
        <div id="blocklyDiv" class="blocklyDiv border rounded shadow-sm w-100 flex-grow-1 h-100"></div>
      </div>
    </div>
  </main>

  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasExample" aria-labelledby="offcanvasExampleLabel">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" id="offcanvasExampleLabel">Settings</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
      <div>
        Version
        <hr>
        Pocket Version: 21
        <br>
        Pocket Maker Version: 4.26
        <hr>
        Credits
        <hr>
        Suitscape Entertenaiment
        <br>
        Google Blockly
        <br>
        SweetAlert2
        <br>
        Bootstrap 5
        <br>
        Font Awesome
      </div>
    </div>
  </div>

  <xml id="toolbox" style="display: none">
    <category name="Eventos" colour="180">
      <block type="al_iniciar"></block>
    </category>
    <category name="Logic" colour="%{BKY_LOGIC_HUE}">
      <block type="controls_if"></block>
      <block type="logic_compare"></block>
      <block type="logic_boolean"></block>
      <block type="logic_operation"></block>
      <block type="logic_negate"></block>
      <block type="logic_null"></block>
      <block type="logic_ternary"></block>
      <block type="text"></block>
    </category>
    <category name="Web Console" colour="5">
      <block type="print"></block>
      <block type="warning"></block>
      <block type="error"></block>
    </category>
    <category name="Virtual Console" colour="7">
      <block type="printv"></block>
      <block type="warningv"></block>
      <block type="errorv"></block>
    </category>
    <category name="Loops" colour="%{BKY_LOOPS_HUE}">
      <block type="controls_repeat_ext"></block>
      <block type="controls_whileUntil"></block>
      <block type="forever"></block>
    </category>
    <category name="Matematic" colour="%{BKY_MATH_HUE}">
      <block type="math_number"></block>
      <block type="math_arithmetic"></block>
      <block type="math_single"></block>
      <block type="math_trig"></block>
      <block type="math_constant"></block>
      <block type="math_number_property"></block>
      <block type="math_round"></block>
      <block type="math_modulo"></block>
      <block type="math_constrain"></block>
      <block type="math_random_int"></block>
      <block type="math_random_float"></block>
    </category>
    <category name="2D" colour="0">
      <block type="limpiar_pantalla"></block>
      <block type="dibujar_rectangulo"></block>
    </category>
    <category name="Canvas API" colour="204">
      <block type="beginPath"></block>
      <block type="closePath"></block>
      <block type="moveTo"></block>
      <block type="lineTo"></block>
      <block type="stroke"></block>
    </category>
    <category name="Music" colour="304">
      <block type="playnote"></block>
    </category>
    <category name="Variables" custom="VARIABLE" colour="330"></category>
    <category name="Lists" colour="%{BKY_LISTS_HUE}">
      <block type="lists_create_empty"></block>
      <block type="lists_create_with"></block>
      <block type="lists_repeat">
        <value name="NUM">
          <shadow type="math_number">
            <field name="NUM">5</field>
          </shadow>
        </value>
      </block>
      <block type="lists_length"></block>
      <block type="lists_isEmpty"></block>
      <block type="lists_indexOf"></block>
      <block type="lists_getIndex"></block>
      <block type="lists_setIndex"></block>
    </category>
  </xml>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKf3c6yR4kY6V6aOtwvwV8eX60S2N8b4F/z3bA99fG5+y29X+X7S3z1Z+I9Y6aO" crossorigin="anonymous"></script>
  <script src="./engine.js"></script>
  <script src="./objects.js"></script>
  <script src="./scratch-blocks.js"></script>
</body>
</html>
